<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Watercolor edge distortion -->
    <filter id="wc" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.038 0.028" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="G" result="dist"/>
      <feGaussianBlur in="dist" stdDeviation="1.6" result="out"/>
    </filter>
    <!-- Softer wash for background elements -->
    <filter id="wc-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.022" numOctaves="3" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" result="dist"/>
      <feGaussianBlur in="dist" stdDeviation="3.5" result="out"/>
    </filter>
    <!-- Pure blur for atmospheric washes -->
    <filter id="blur-bg">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur-med">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <!-- Paper texture -->
    <filter id="paper" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
    <!-- Subtle hair/cloth texture -->
    <filter id="wc-hair" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.055 0.04" numOctaves="3" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="dist"/>
      <feGaussianBlur in="dist" stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- ─────────────────────────────────────────────── -->
  <!-- PAPER BACKGROUND                                -->
  <!-- ─────────────────────────────────────────────── -->
  <rect width="800" height="1000" fill="#F4EDE0"/>
  <rect width="800" height="1000" fill="#F0E8D4" opacity="0.38" filter="url(#paper)"/>

  <!-- ─────────────────────────────────────────────── -->
  <!-- SKY WASHES                                      -->
  <!-- ─────────────────────────────────────────────── -->
  <ellipse cx="400" cy="240" rx="500" ry="320" fill="#EDE5C8" opacity="0.55" filter="url(#blur-bg)"/>
  <ellipse cx="160" cy="160" rx="280" ry="200" fill="#E8DDB8" opacity="0.45" filter="url(#blur-bg)"/>
  <ellipse cx="680" cy="200" rx="220" ry="170" fill="#E4EDD0" opacity="0.38" filter="url(#blur-bg)"/>
  <ellipse cx="580" cy="120" rx="180" ry="120" fill="#EAE0C0" opacity="0.32" filter="url(#blur-bg)"/>

  <!-- ─────────────────────────────────────────────── -->
  <!-- GROUND WASHES                                   -->
  <!-- ─────────────────────────────────────────────── -->
  <!-- Base lawn -->
  <path d="M -10,650 C 60,628 180,615 320,622 C 460,629 560,618 680,625 C 750,629 790,635 810,642 L 810,1010 L -10,1010 Z"
        fill="#98BC98" opacity="0.72" filter="url(#wc-soft)"/>
  <!-- Lighter mid-ground -->
  <path d="M -10,690 C 80,672 220,660 380,668 C 530,676 660,664 810,672 L 810,1010 L -10,1010 Z"
        fill="#AECAAE" opacity="0.55" filter="url(#wc-soft)"/>
  <!-- Warm shadow edges of lawn -->
  <path d="M -10,760 L 160,760 L 130,1010 L -10,1010 Z" fill="#7A9E7A" opacity="0.28" filter="url(#blur-med)"/>
  <path d="M 640,760 L 810,760 L 810,1010 L 660,1010 Z" fill="#7A9E7A" opacity="0.25" filter="url(#blur-med)"/>

  <!-- ─────────────────────────────────────────────── -->
  <!-- HOUSE                                           -->
  <!-- ─────────────────────────────────────────────── -->
  <!-- Ambient shadow under house -->
  <ellipse cx="500" cy="728" rx="195" ry="22" fill="#5A7A50" opacity="0.18" filter="url(#blur-bg)"/>

  <!-- House walls -->
  <path d="M 305,432 L 695,432 L 695,728 L 305,728 Z" fill="#ECD8BC" opacity="0.93" filter="url(#wc)"/>
  <!-- Wall shadow (right side in shade) -->
  <path d="M 500,432 L 695,432 L 695,728 L 500,728 Z" fill="#D8C4A8" opacity="0.28" filter="url(#blur-med)"/>
  <!-- Wall highlight (top-left lit) -->
  <path d="M 305,432 L 500,432 L 500,600 L 305,600 Z" fill="#F8ECD8" opacity="0.2" filter="url(#blur-med)"/>

  <!-- Roof -->
  <path d="M 278,438 L 500,288 L 722,438 Z" fill="#C49080" opacity="0.88" filter="url(#wc)"/>
  <!-- Roof: shadow side -->
  <path d="M 500,288 L 722,438 L 500,438 Z" fill="#A87060" opacity="0.32" filter="url(#blur-med)"/>
  <!-- Roof: lit side highlight -->
  <path d="M 278,438 L 500,288 L 500,438 Z" fill="#E0A888" opacity="0.18" filter="url(#blur-med)"/>
  <!-- Roof ridge line -->
  <path d="M 278,440 L 500,290" stroke="#B47868" stroke-width="2.5" opacity="0.35" fill="none" filter="url(#wc)"/>

  <!-- Chimney -->
  <rect x="608" y="330" width="46" height="82" rx="2" fill="#B88870" opacity="0.88" filter="url(#wc)"/>
  <rect x="602" y="324" width="58" height="15" rx="2" fill="#A47860" opacity="0.90" filter="url(#wc)"/>

  <!-- Left window -->
  <rect x="336" y="480" width="100" height="84" rx="3" fill="#D0DDE0" opacity="0.82" filter="url(#wc)"/>
  <rect x="340" y="484" width="44" height="38" rx="1" fill="#FFFFFF" opacity="0.22" filter="url(#blur-sm)"/>
  <rect x="386" y="484" width="46" height="38" rx="1" fill="#E8F0F2" opacity="0.18" filter="url(#blur-sm)"/>
  <rect x="336" y="480" width="100" height="84" rx="3" fill="none" stroke="#C0A87C" stroke-width="3.5" opacity="0.50" filter="url(#wc)"/>
  <!-- Window sill -->
  <rect x="330" y="562" width="112" height="8" rx="2" fill="#D4BC98" opacity="0.7" filter="url(#wc)"/>

  <!-- Right window -->
  <rect x="562" y="480" width="100" height="84" rx="3" fill="#D0DDE0" opacity="0.82" filter="url(#wc)"/>
  <rect x="566" y="484" width="44" height="38" rx="1" fill="#FFFFFF" opacity="0.22" filter="url(#blur-sm)"/>
  <rect x="612" y="484" width="46" height="38" rx="1" fill="#E8F0F2" opacity="0.18" filter="url(#blur-sm)"/>
  <rect x="562" y="480" width="100" height="84" rx="3" fill="none" stroke="#C0A87C" stroke-width="3.5" opacity="0.50" filter="url(#wc)"/>
  <rect x="556" y="562" width="112" height="8" rx="2" fill="#D4BC98" opacity="0.7" filter="url(#wc)"/>

  <!-- Door (arched) -->
  <path d="M 462,610 Q 462,580 499,580 Q 536,580 536,610 L 536,728 L 462,728 Z"
        fill="#4A6E58" opacity="0.90" filter="url(#wc)"/>
  <!-- Door panels -->
  <rect x="470" y="622" width="56" height="28" rx="3" fill="#3D5C48" opacity="0.38" filter="url(#blur-sm)"/>
  <rect x="470" y="660" width="56" height="28" rx="3" fill="#3D5C48" opacity="0.32" filter="url(#blur-sm)"/>
  <!-- Door knob -->
  <circle cx="530" cy="670" r="4.5" fill="#C8A860" opacity="0.85"/>
  <!-- Door highlight -->
  <path d="M 462,610 Q 462,580 499,580 L 480,582 Q 468,592 466,614 Z" fill="#6A8E78" opacity="0.22" filter="url(#blur-sm)"/>

  <!-- Front steps -->
  <path d="M 452,728 L 546,728 L 554,744 L 444,744 Z" fill="#D8C8A8" opacity="0.80" filter="url(#wc)"/>
  <path d="M 442,744 L 556,744 L 564,758 L 434,758 Z" fill="#CCBC9C" opacity="0.78" filter="url(#wc)"/>

  <!-- ─────────────────────────────────────────────── -->
  <!-- LARGE RIGHT JUNIPER (flanking)                  -->
  <!-- ─────────────────────────────────────────────── -->
  <g filter="url(#wc)" opacity="0.91">
    <ellipse cx="712" cy="700" rx="30" ry="20" fill="#3A5A42"/>
    <ellipse cx="708" cy="668" rx="46" ry="27" fill="#3D5C45"/>
    <ellipse cx="712" cy="636" rx="44" ry="25" fill="#406248"/>
    <ellipse cx="708" cy="606" rx="42" ry="23" fill="#3E6046"/>
    <ellipse cx="712" cy="577" rx="40" ry="22" fill="#426448"/>
    <ellipse cx="708" cy="548" rx="38" ry="20" fill="#3E6046"/>
    <ellipse cx="712" cy="520" rx="35" ry="19" fill="#406248"/>
    <ellipse cx="708" cy="493" rx="32" ry="17" fill="#3D5E45"/>
    <ellipse cx="712" cy="467" rx="29" ry="16" fill="#426448"/>
    <ellipse cx="708" cy="442" rx="26" ry="14" fill="#3E6046"/>
    <ellipse cx="712" cy="418" rx="23" ry="13" fill="#406248"/>
    <ellipse cx="708" cy="394" rx="20" ry="12" fill="#3D5E45"/>
    <ellipse cx="711" cy="372" rx="18" ry="11" fill="#426448"/>
    <ellipse cx="708" cy="350" rx="15" ry="9"  fill="#3E6046"/>
    <ellipse cx="711" cy="330" rx="13" ry="8"  fill="#406248"/>
    <ellipse cx="709" cy="311" rx="11" ry="7"  fill="#3D5C42"/>
    <ellipse cx="711" cy="294" rx="9"  ry="6"  fill="#3A5840"/>
    <ellipse cx="710" cy="278" rx="7"  ry="6"  fill="#3D5C42"/>
    <!-- Highlight catches -->
    <ellipse cx="698" cy="595" rx="16" ry="8" fill="#5E8060" opacity="0.32"/>
    <ellipse cx="700" cy="468" rx="13" ry="7" fill="#60826A" opacity="0.28"/>
    <ellipse cx="698" cy="348" rx="10" ry="6" fill="#5E8060" opacity="0.25"/>
  </g>

  <!-- ─────────────────────────────────────────────── -->
  <!-- SMALL LEFT BACKGROUND JUNIPER                   -->
  <!-- ─────────────────────────────────────────────── -->
  <g filter="url(#wc-soft)" opacity="0.76">
    <ellipse cx="92" cy="668" rx="23" ry="16" fill="#3A5A42"/>
    <ellipse cx="90" cy="642" rx="34" ry="20" fill="#3D5C45"/>
    <ellipse cx="93" cy="616" rx="32" ry="18" fill="#406248"/>
    <ellipse cx="90" cy="591" rx="29" ry="17" fill="#3E6046"/>
    <ellipse cx="93" cy="567" rx="26" ry="15" fill="#426448"/>
    <ellipse cx="90" cy="544" rx="23" ry="13" fill="#3E6046"/>
    <ellipse cx="92" cy="522" rx="20" ry="12" fill="#406248"/>
    <ellipse cx="90" cy="501" rx="17" ry="11" fill="#3D5E45"/>
    <ellipse cx="92" cy="481" rx="14" ry="10" fill="#426448"/>
    <ellipse cx="90" cy="462" rx="12" ry="9"  fill="#3E6046"/>
    <ellipse cx="92" cy="444" rx="10" ry="8"  fill="#3A5840"/>
    <ellipse cx="91" cy="428" rx="8"  ry="7"  fill="#3D5C42"/>
  </g>

  <!-- ─────────────────────────────────────────────── -->
  <!-- YOUNG JUNIPER (planted in front of home)        -->
  <!-- ─────────────────────────────────────────────── -->
  <g filter="url(#wc)" opacity="0.93">
    <ellipse cx="562" cy="722" rx="19" ry="13" fill="#5C7A65"/>
    <ellipse cx="560" cy="704" rx="24" ry="14" fill="#5A7862"/>
    <ellipse cx="562" cy="687" rx="22" ry="13" fill="#5E7C66"/>
    <ellipse cx="560" cy="670" rx="20" ry="12" fill="#507062"/>
    <ellipse cx="562" cy="654" rx="18" ry="11" fill="#5C7A65"/>
    <ellipse cx="560" cy="638" rx="16" ry="10" fill="#527464"/>
    <ellipse cx="562" cy="623" rx="14" ry="9"  fill="#5E7C68"/>
    <ellipse cx="560" cy="609" rx="12" ry="8"  fill="#507060"/>
    <ellipse cx="562" cy="595" rx="10" ry="7"  fill="#5C7A65"/>
    <ellipse cx="561" cy="582" rx="8"  ry="6"  fill="#527060"/>
    <ellipse cx="562" cy="570" rx="6"  ry="5"  fill="#5C7A65"/>
    <!-- Fresh growth highlight -->
    <ellipse cx="554" cy="645" rx="8"  ry="5"  fill="#7A9E7E" opacity="0.40"/>
    <ellipse cx="555" cy="598" rx="6"  ry="4"  fill="#7A9E7E" opacity="0.35"/>
  </g>

  <!-- ─────────────────────────────────────────────── -->
  <!-- COUPLE                                          -->
  <!-- ─────────────────────────────────────────────── -->
  <!-- Ground shadows -->
  <ellipse cx="292" cy="886" rx="55" ry="13" fill="#4A6A45" opacity="0.20" filter="url(#blur-med)"/>
  <ellipse cx="400" cy="886" rx="50" ry="13" fill="#4A6A45" opacity="0.17" filter="url(#blur-med)"/>

  <!-- ── PERSON 1 (taller, sage green, left) ── -->
  <!-- Legs -->
  <path d="M 256,806 C 255,832 254,856 252,886 L 272,886 C 272,858 272,832 274,806 Z"
        fill="#456A58" opacity="0.86" filter="url(#wc)"/>
  <path d="M 308,806 C 308,828 310,855 314,886 L 332,886 C 330,855 328,826 326,806 Z"
        fill="#456A58" opacity="0.86" filter="url(#wc)"/>
  <!-- Torso / top (sage green) -->
  <path d="M 244,628 C 238,660 236,706 238,752 C 240,792 246,810 260,818 L 326,818 C 340,810 344,792 344,752 C 342,706 340,660 334,628 C 322,614 258,614 244,628 Z"
        fill="#5C7A65" opacity="0.91" filter="url(#wc)"/>
  <!-- Torso highlight (light catches on left) -->
  <path d="M 248,633 C 244,664 242,700 245,736 C 247,764 252,796 264,816 L 296,816 C 280,796 275,762 275,736 C 274,700 274,664 270,633 Z"
        fill="#7A9E7E" opacity="0.18" filter="url(#blur-med)"/>
  <!-- Arm around Person 2 -->
  <path d="M 332,668 C 352,655 374,646 396,642 C 414,639 428,644 444,654 C 436,660 424,663 412,665 C 394,668 374,674 358,680 C 346,684 338,682 330,676 Z"
        fill="#5C7A65" opacity="0.86" filter="url(#wc)"/>
  <!-- Neck -->
  <rect x="276" y="595" width="30" height="32" rx="12" fill="#D4A880" opacity="0.88" filter="url(#wc)"/>
  <!-- Head -->
  <ellipse cx="291" cy="560" rx="44" ry="46" fill="#D4A880" opacity="0.92" filter="url(#wc)"/>
  <!-- Head: warm highlight cheek -->
  <ellipse cx="280" cy="548" rx="22" ry="20" fill="#E8BEA0" opacity="0.32" filter="url(#blur-sm)"/>
  <!-- Hair (dark, slightly wavy) -->
  <path d="M 250,545 C 246,514 250,492 264,480 C 272,473 282,468 292,468 C 308,468 322,475 332,488 C 342,500 344,520 340,544 C 334,530 330,518 326,512 C 318,498 306,490 292,490 C 278,490 266,498 259,512 C 255,520 252,532 250,545 Z"
        fill="#4A3422" opacity="0.88" filter="url(#wc-hair)"/>
  <!-- Hair shadow on neck -->
  <path d="M 250,540 C 246,516 248,498 258,484 C 250,494 246,510 246,530 Z"
        fill="#2E1C10" opacity="0.38" filter="url(#blur-sm)"/>

  <!-- ── PERSON 2 (shorter, cream/warm clothing, right) ── -->
  <!-- Legs -->
  <path d="M 362,806 C 361,830 360,856 358,886 L 378,886 C 377,856 377,828 378,806 Z"
        fill="#C4A070" opacity="0.76" filter="url(#wc)"/>
  <path d="M 412,806 C 413,828 415,855 418,886 L 436,886 C 434,855 432,826 430,806 Z"
        fill="#C4A070" opacity="0.76" filter="url(#wc)"/>
  <!-- Torso (warm cream / ivory) -->
  <path d="M 352,644 C 347,674 345,714 347,756 C 349,790 354,808 368,818 L 430,818 C 442,808 446,790 445,756 C 443,714 440,674 436,644 C 424,630 362,630 352,644 Z"
        fill="#E8D4B8" opacity="0.92" filter="url(#wc)"/>
  <!-- Torso highlight -->
  <path d="M 357,650 C 353,679 351,712 354,742 C 356,770 361,796 372,816 L 396,816 C 382,796 378,768 378,742 C 376,712 376,679 372,650 Z"
        fill="#FFFFFF" opacity="0.22" filter="url(#blur-med)"/>
  <!-- Hand resting on Person 1 (Person 2's left arm) -->
  <path d="M 354,695 C 342,686 328,680 316,676 L 312,686 C 326,690 340,698 352,708 Z"
        fill="#CEAA8A" opacity="0.72" filter="url(#wc)"/>
  <!-- Neck -->
  <rect x="382" y="613" width="28" height="30" rx="11" fill="#CEA882" opacity="0.88" filter="url(#wc)"/>
  <!-- Head -->
  <ellipse cx="396" cy="579" rx="40" ry="42" fill="#CEA882" opacity="0.92" filter="url(#wc)"/>
  <!-- Head: warm highlight -->
  <ellipse cx="386" cy="567" rx="19" ry="17" fill="#E4BEA0" opacity="0.32" filter="url(#blur-sm)"/>
  <!-- Hair (Person 2 — warm auburn, longer) -->
  <path d="M 360,562 C 356,530 360,508 374,496 C 382,488 390,484 397,484 C 410,484 422,491 430,504 C 438,516 440,538 436,562 C 430,546 425,534 420,528 C 411,516 403,510 396,510 C 383,510 372,518 366,532 C 362,540 360,552 360,562 Z"
        fill="#8A6438" opacity="0.85" filter="url(#wc-hair)"/>
  <!-- Hair flowing down sides -->
  <path d="M 358,560 C 356,578 356,606 360,635 L 352,645 C 347,616 347,586 349,560 Z"
        fill="#7A5A30" opacity="0.48" filter="url(#blur-sm)"/>
  <path d="M 434,558 C 436,576 436,604 432,635 L 440,644 C 444,616 444,584 442,558 Z"
        fill="#7A5A30" opacity="0.42" filter="url(#blur-sm)"/>

  <!-- ─────────────────────────────────────────────── -->
  <!-- WALKWAY / PATH TO DOOR                         -->
  <!-- ─────────────────────────────────────────────── -->
  <path d="M 452,758 L 554,758 L 578,826 L 428,826 Z"
        fill="#D8C8A8" opacity="0.55" filter="url(#wc)"/>
  <!-- Walkway stones suggestion -->
  <ellipse cx="500" cy="778" rx="22" ry="6" fill="#C8B898" opacity="0.30" filter="url(#blur-sm)"/>
  <ellipse cx="502" cy="804" rx="20" ry="5" fill="#C8B898" opacity="0.28" filter="url(#blur-sm)"/>

  <!-- ─────────────────────────────────────────────── -->
  <!-- FOREGROUND DETAILS                              -->
  <!-- ─────────────────────────────────────────────── -->
  <!-- Soft grass tufts -->
  <path d="M 112,828 C 120,806 125,796 134,792 C 129,806 130,818 128,830 Z" fill="#5A8055" opacity="0.48"/>
  <path d="M 136,822 C 144,802 148,794 156,790 C 152,804 152,816 150,824 Z" fill="#5A8055" opacity="0.42"/>
  <path d="M 620,824 C 628,804 632,794 640,790 C 636,804 636,816 634,826 Z" fill="#5A8055" opacity="0.42"/>
  <path d="M 654,820 C 662,800 666,792 674,788 C 670,802 670,814 668,822 Z" fill="#5A8055" opacity="0.38"/>
  <!-- Small wildflowers near house base -->
  <circle cx="308" cy="726" r="6"  fill="#D49080" opacity="0.58" filter="url(#blur-sm)"/>
  <circle cx="320" cy="722" r="5"  fill="#E0A088" opacity="0.52" filter="url(#blur-sm)"/>
  <circle cx="332" cy="725" r="5"  fill="#D49080" opacity="0.48" filter="url(#blur-sm)"/>
  <circle cx="668" cy="726" r="6"  fill="#D49080" opacity="0.58" filter="url(#blur-sm)"/>
  <circle cx="657" cy="722" r="5"  fill="#E0A088" opacity="0.50" filter="url(#blur-sm)"/>
  <!-- Very small wildflowers near base of young tree -->
  <circle cx="548" cy="726" r="4"  fill="#C8D89A" opacity="0.55" filter="url(#blur-sm)"/>
  <circle cx="576" cy="726" r="4"  fill="#C8D89A" opacity="0.50" filter="url(#blur-sm)"/>

  <!-- ─────────────────────────────────────────────── -->
  <!-- DEPTH / VIGNETTE                                -->
  <!-- ─────────────────────────────────────────────── -->
  <!-- Bottom ground shadow vignette -->
  <rect x="0" y="860" width="800" height="140" fill="#6A9068" opacity="0.14" filter="url(#blur-bg)"/>
  <!-- Very subtle warm tint overall (unifies the painting) -->
  <rect width="800" height="1000" fill="#DEC898" opacity="0.055"/>
</svg>
