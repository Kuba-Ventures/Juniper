kind = "web"
previewPath = "/"
title = "Juniper"
version = "1.0.0"
id = "artifacts/juniper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20336

[services.development]
run = "pnpm --filter @workspace/juniper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/juniper", "run", "build" ]
publicDir = "artifacts/juniper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20336"
BASE_PATH = "/"
