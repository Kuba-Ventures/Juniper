<!doctype html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Net worth backfill: three treatments</title>
<link rel="stylesheet" href="../artifacts/juniper/src/styles/juniper.css">
<style>
  html,body{margin:0}
  .vswitch{position:fixed;z-index:200;right:18px;bottom:18px;display:flex;gap:6px;align-items:center;
    background:#0B0F0B;border:1px solid #2A332A;border-radius:12px;padding:7px 9px;
    font:13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#717B6E;box-shadow:0 10px 30px -12px rgba(0,0,0,.8)}
  .vswitch b{font-weight:600;color:#A6B0A2;margin-right:3px}
  .vswitch button{font:inherit;font-weight:600;border:1px solid #2A332A;background:#171E17;color:#A6B0A2;
    border-radius:8px;padding:6px 11px;cursor:pointer}
  .vswitch button[aria-pressed="true"]{background:#213024;border-color:#6FB98C;color:#8ACFA4}
  .wrap{max-width:760px;margin:0 auto;padding:22px}
  .vhead{font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#717B6E;
    letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin:0 0 10px 2px}
  .nw-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px}
  .nw-lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--jnpr-ink-3)}
  .nw-val{font-size:38px;font-weight:700;letter-spacing:-.02em;color:var(--jnpr-ink);line-height:1.1;margin-top:2px}
  .nw-delta{font-size:13px;font-weight:650;color:var(--jnpr-good);margin-top:4px}
  .nw-foot{font-size:12px;color:var(--jnpr-ink-3);line-height:1.55;margin:12px 2px 0}
  .nw-foot b{color:var(--jnpr-ink-2);font-weight:650}
  .nw-legend{display:flex;gap:16px;align-items:center;margin:12px 2px 0;font-size:11.5px;color:var(--jnpr-ink-3);flex-wrap:wrap}
  .nw-legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--jnpr-accent);margin-right:7px;vertical-align:3px}
  .nw-legend i.est{border-top-style:dashed}
  .joinmark{font-size:10px;fill:var(--jnpr-ink-3);letter-spacing:.04em}
</style>
</head>
<body class="jnpr">
<div class="wrap">
  <p class="vhead" id="vhead">Treatment A</p>
  <div class="card" id="card"></div>
  <p class="nw-foot" id="tradeoff" style="margin-top:16px"></p>
</div>

<div class="vswitch">
  <b>Treatment</b>
  <button data-v="a" aria-pressed="true">A</button>
  <button data-v="b" aria-pressed="false">B</button>
  <button data-v="c" aria-pressed="false">C</button>
</div>

<script>
// 60 days back from today. Cash moves with real transactions: income twice a
// month, rent at the start, everyday spending as a slow drift. Investments are
// the thing the three treatments disagree about.
const DAYS = 60, JOIN = 35; // JOIN = index where the member linked (day 35 of 60)
const CASH_NOW = 26614, INVEST_NOW = 71078;

// Deterministic daily cash deltas, no randomness: paydays, rent, and drift.
const daily = [];
for (let i = 0; i < DAYS; i++) {
  let d = -31;                                  // everyday spending
  if (i % 15 === 3) d += 1241;                  // semi-monthly pay
  if (i % 30 === 1) d -= 620;                   // rent-ish
  if (i % 9 === 0) d -= 44;                     // a subscription cluster
  daily.push(d);
}
// Walk backward from today's known cash balance, the same arithmetic the
// backfill uses: balance(day) = balance_now + sum(amounts after that day).
const cash = new Array(DAYS);
cash[DAYS - 1] = CASH_NOW;
for (let i = DAYS - 2; i >= 0; i--) cash[i] = cash[i + 1] - daily[i + 1];

// Investments, as each treatment sees them.
const investFlat = new Array(DAYS).fill(INVEST_NOW);
// Contributions only: $500 on the 1st of each month, market movement excluded.
const contrib = [];
for (let i = 0; i < DAYS; i++) contrib.push(i % 30 === 1 ? 500 : 0);
const investContrib = new Array(DAYS);
investContrib[DAYS - 1] = INVEST_NOW;
for (let i = DAYS - 2; i >= 0; i--) investContrib[i] = investContrib[i + 1] - contrib[i + 1];
// What actually happened, for reference only: market moved too.
const drift = [0.972,0.974,0.971,0.978,0.981,0.979,0.983,0.986,0.984,0.988,0.986,0.99,0.993,0.991,0.995,0.994,0.997,0.999,0.996,1.0];
const investTrue = investContrib.map((v, i) => Math.round(v * drift[Math.floor(i / DAYS * drift.length)]));

const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
const MONTH = ["Jul","Jul","Aug","Aug"];

function chart(series, opts) {
  const W = 560, H = 170, padL = 6, padR = 6, padT = 12, padB = 18;
  const pts = series.filter((v) => v != null);
  const minV = Math.min(...pts), maxV = Math.max(...pts), spread = maxV - minV;
  const pad = spread > 0 ? spread * 0.06 : (Math.abs(maxV) || 1000) * 0.08;
  const min = minV - pad, max = maxV + pad;
  const n = series.length;
  const x = (i) => padL + (i * (W - padL - padR)) / (n - 1);
  const y = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
  const seg = (from, to) => series.slice(from, to + 1)
    .map((v, k) => (k ? "L" : "M") + x(from + k).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const areaFor = (from, to) => "M" + x(from) + " " + y(series[from]) + " " +
    series.slice(from, to + 1).map((v, k) => "L" + x(from + k).toFixed(1) + " " + y(v).toFixed(1)).join(" ") +
    " L" + x(to) + " " + (H - padB) + " L" + x(from) + " " + (H - padB) + " Z";
  const grid = [0, 0.5, 1].map((f) => padT + f * (H - padT - padB));
  const jx = x(opts.join);

  let paths = "";
  if (opts.split) {
    paths += '<path class="nw-area" d="' + areaFor(opts.join, n - 1) + '"/>';
    paths += '<path class="nw-line" d="' + seg(0, opts.join) + '" stroke-dasharray="4 3" opacity="0.85"/>';
    paths += '<path class="nw-line" d="' + seg(opts.join, n - 1) + '"/>';
  } else if (opts.dashBefore) {
    paths += '<path class="nw-area" d="' + areaFor(0, n - 1) + '"/>';
    paths += '<path class="nw-line" d="' + seg(0, opts.join) + '" stroke-dasharray="4 3" opacity="0.85"/>';
    paths += '<path class="nw-line" d="' + seg(opts.join, n - 1) + '"/>';
  } else {
    paths += '<path class="nw-area" d="' + areaFor(0, n - 1) + '"/>';
    paths += '<path class="nw-line" d="' + seg(0, n - 1) + '"/>';
  }

  const ticks = [0, 20, 40, 59];
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="none" style="display:block;overflow:visible">' +
    grid.map((gy) => '<line class="nw-grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy + '" y2="' + gy + '"/>').join("") +
    '<line class="nw-grid" x1="' + jx + '" x2="' + jx + '" y1="' + padT + '" y2="' + (H - padB) + '" style="stroke:var(--jnpr-ink-3);opacity:.55;stroke-dasharray:2 3"/>' +
    '<text class="joinmark" x="' + (jx + 5) + '" y="' + (padT + 10) + '">you joined</text>' +
    paths +
    '<circle class="nw-dot" cx="' + x(n - 1) + '" cy="' + y(series[n - 1]) + '" r="4"/>' +
    ticks.map((i, k) => '<text class="ax" x="' + x(i) + '" y="' + (H - 5) + '" text-anchor="' + (i === 0 ? "start" : i === 59 ? "end" : "middle") + '">' + MONTH[k] + '</text>').join("") +
    '</svg></div>';
}

const V = {
  a: {
    head: "Treatment A: investments held at today's value",
    series: cash.map((c, i) => c + investFlat[i]),
    opts: { join: JOIN },
    foot: 'Your net worth back to <b>Jul 1</b>, rebuilt from your transactions. Cash and card balances are exact. Investment balances are carried back at today\'s value, since Plaid does not report past market prices.',
    legend: false,
    tradeoff: "One continuous line, and the cheapest to build. The catch: 73% of your net worth is invested, so every past point silently contains today's market value. A month where the market fell shows as flat instead of down."
  },
  b: {
    head: "Treatment B: cash and debt only before you joined",
    series: cash.map((c, i) => (i < JOIN ? c : c + investFlat[i])),
    opts: { join: JOIN, split: true },
    foot: 'Before <b>Aug 5</b>, this shows <b>cash and card balances only</b>, rebuilt from your transactions. Investments join the line the day Juniper first read their balance. Nothing before that point is estimated.',
    legend: true,
    tradeoff: "Nothing invented, which is the rule this repo already holds itself to. The cost is the step at the join date: the line jumps $71,078 the day your brokerage arrives, and that jump is not something that happened to you."
  },
  c: {
    head: "Treatment C: investments net of contributions",
    series: cash.map((c, i) => c + investContrib[i]),
    opts: { join: JOIN, dashBefore: true },
    foot: 'Your net worth back to <b>Jul 1</b>. Cash and card balances are exact. Before <b>Aug 5</b> the invested balance is your holdings today minus the money you have added since, so contributions are counted and market movement is not. Dashed where estimated.',
    legend: true,
    tradeoff: "The most accurate over the weeks you actually care about, because contributions dominate short horizons and this is the only treatment that catches them. Costs an extra Plaid call: /investments/transactions, which your account is already entitled to."
  }
};

function show(k) {
  const v = V[k];
  document.getElementById("vhead").textContent = v.head;
  const first = v.series[0], last = v.series[v.series.length - 1];
  const delta = last - first, pct = Math.round((delta / first) * 1000) / 10;
  document.getElementById("card").innerHTML =
    '<div class="nw-top"><div>' +
      '<div class="nw-lbl">Net worth</div>' +
      '<div class="nw-val tnum">' + money(last) + '</div>' +
      '<div class="nw-delta tnum">' + (delta >= 0 ? "+" : "") + money(delta) + " (" + pct + "%) since Jul 1</div>" +
    '</div>' +
    '<div class="pills"><button>1M</button><button class="on">3M</button><button>6M</button><button>1Y</button><button>All</button></div>' +
    '</div>' +
    chart(v.series, v.opts) +
    (v.legend ? '<div class="nw-legend"><span><i class="est"></i>Rebuilt from transactions</span><span><i></i>Recorded by Juniper</span></div>' : "") +
    '<p class="nw-foot">' + v.foot + '</p>';
  document.getElementById("tradeoff").innerHTML = "<b>Tradeoff.</b> " + v.tradeoff;
  document.querySelectorAll(".vswitch button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === k)));
}
document.querySelectorAll(".vswitch button").forEach((b) => b.addEventListener("click", () => show(b.dataset.v)));
show("a");
</script>
</body>
</html>
